    <section id="json-page" class="container-fluid">
        <div class="row">
            <div id="json-buttons" class="col-12 col-md-3 col-lg-3">
                <div class="container-fluid my-3">
                    <div class="row gap-lg-2 gap-md-2 gap-0">
                        <button class="btn btn-secondary col-6 col-md-12 col-lg-12" type="button"

                    </div>
                </div>
            </div>

            <div id="json-data" class="col-12 col-md-8 col-lg-9">
                <div id="json-rules-div" class="collapse mb-3" data-bs-parent="#json-data">
                    <h1 class="mt-3">Rules of JSON Values</h1>
                    <h5>Data source: a private Supabase Storage bucket</h5>
                    <input type="text" id="searchBox" class="w-100 mb-3" placeholder="Search by title or description...">
                    <p id="noResultsMessage" style="display:none;">No matching records were found.</p>
                    <div id="json-data-here" class="row g-4"></div>
                </div>

                <div id="rest-api-div" class="collapse mb-3" data-bs-parent="#json-data">
                    <h1 id="rest-api-heading" class="my-3">List of submitted data (on Form page)</h1>
                    <div id="rest-data-here" class="row g-4"></div>
